<!doctype html>
<html lang="en">
  <head>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Restores the real URL (encoded by 404.html) before the app mounts,
      // so React Router sees the path the user actually navigated to.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-512.png" />
    <!-- interactive-widget=resizes-content makes Chrome shrink the layout
         viewport (and dvh units) when the on-screen keyboard opens, instead
         of only panning the visual viewport — without this, sticky/dvh-based
         layouts stay anchored to the pre-keyboard viewport and elements like
         the editor toolbar appear to scroll off-screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A clean markdown note-taking app." />
    <title>Leaf</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
